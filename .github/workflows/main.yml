# Builds Clip Captions and puts the APK on the repository's Releases page as a plain .apk file,
# so it can be downloaded straight onto a phone (no zip, no Google Drive). Orion Store picks up
# new versions from here too.
#
# This file must live at the TOP of the repository, in .github/workflows/.
# It finds the app by itself, whether its files are in a ClipCaptions folder or at the top,
# and always builds the newest copy (the highest versionCode).

name: Build APK

on:
  push:
    # These only start the model mirror (models.yml) or the download count (stats.yml).
    branches-ignore: [models-request, stats-request]
  workflow_dispatch:

permissions:
  contents: write

# Uploading several files one after another starts several builds: only the newest one finishes.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the app
        id: find
        run: |
          best=""; bestCode=-1; found=""
          while IFS= read -r f; do
            dir=$(dirname "$(dirname "$f")")
            [ -f "$dir/settings.gradle.kts" ] || continue
            code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$f" | head -1)
            name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$f" | head -1)
            found="$found\n  $dir (version $name)"
            if [ "${code:-0}" -gt "$bestCode" ]; then best="$dir"; bestCode="${code:-0}"; bestName="$name"; fi
          done < <(find . -path ./.git -prune -o -path '*/app/build.gradle.kts' -print)
          if [ -z "$best" ]; then
            echo "::error::Couldn't find the app's files (app/build.gradle.kts next to settings.gradle.kts)."
            exit 1
          fi
          echo -e "Copies of the app in this repository:$found"
          echo "Building version $bestName from $best"
          if [ ! -f "$best/keystore/debug.keystore" ]; then
            echo "::error::$best/keystore/debug.keystore is missing. Upload the keystore folder too, or the phone won't install updates over the old version."
            exit 1
          fi
          echo "dir=$best" >> "$GITHUB_OUTPUT"
          echo "version=$bestName" >> "$GITHUB_OUTPUT"

      # Mozilla's offline translator (ClipCaptions/translator, in Rust), built for phones and dropped
      # into the app's native libraries before Gradle packs them. Cached, so it only rebuilds when
      # the translator itself changes.
      - name: Get Rust ready for phones
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ${{ steps.find.outputs.dir }}/translator/target-*
          key: translator-${{ hashFiles('**/translator/Cargo.lock', '**/translator/src/**', '**/translator/fxtranslate/build.rs', '**/translator/fxtranslate/src/**') }}
          restore-keys: translator-

      - name: Build the offline translator
        working-directory: ${{ steps.find.outputs.dir }}/translator
        run: |
          command -v cargo-ndk || cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          # One copy of the C++ runtime inside the library; fail rather than fall back to slow maths.
          export CXXSTDLIB=c++_static RUSTFLAGS="-C link-arg=-lc++abi" FXTRANSLATE_REQUIRE_SIMD=1
          out=../app/src/main/jniLibs
          # Every phone: plain NEON on 64-bit ARM, NEON on 32-bit ARM, AVX2 on x86 (emulators).
          FXT_ARM_KERNEL=neon64 cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 29 -o "$out" build --release --target-dir target-neon
          # Newer phones (i8mm): faster maths. The app picks this one only when the CPU has it.
          cargo ndk -t arm64-v8a -P 29 -o out-i8mm build --release --target-dir target-i8mm
          cp out-i8mm/arm64-v8a/libcctranslate.so "$out/arm64-v8a/libcctranslate_i8mm.so"
          ls -l "$out"/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The caption logic tests (line splitting, sentence joining, tidying text for the translator).
      # A failure stops the build, so a broken APK never reaches the Releases page.
      - name: Run the logic tests
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if ! command -v kotlinc >/dev/null; then
            curl -sSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
            unzip -q /tmp/kotlinc.zip -d /tmp
            export PATH="/tmp/kotlinc/bin:$PATH"
          fi
          bash tools/logic-tests/run.sh

      - uses: gradle/actions/setup-gradle@v4

      # With the RELEASE_KEY_PASSWORD secret: a release build signed with the private key, the one
      # people install. Without it (a fork, say): a test build signed with the test key, published
      # as a pre-release so it never becomes the "latest" download.
      - name: Build the app
        id: build
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$RELEASE_KEY_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The RELEASE_KEY_PASSWORD secret isn't set, so this is a test build signed with the test key."
            ./gradlew assembleDebug --no-daemon
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "kind=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the APK after its version
        id: apk
        env:
          DIR: ${{ steps.find.outputs.dir }}
          VERSION: ${{ steps.find.outputs.version }}
          BUILT: ${{ steps.build.outputs.apk }}
          KIND: ${{ steps.build.outputs.kind }}
        run: |
          if [ "$KIND" = "release" ]; then file="ClipCaptions-$VERSION.apk"; else file="ClipCaptions-$VERSION-test.apk"; fi
          cp "$DIR/$BUILT" "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipCaptions-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.find.outputs.version }}
          APK: ${{ steps.apk.outputs.file }}
          KIND: ${{ steps.build.outputs.kind }}
        run: |
          if [ "$KIND" = "release" ]; then
            tag="v$VERSION-build$GITHUB_RUN_NUMBER"
            gh release create "$tag" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Clip Captions $VERSION" \
              --notes "Tap $APK under Assets to download it, then open it to install. Updates install over the previous version and keep your settings. Needs Android 10 or newer." \
              --latest
          else
            tag="v$VERSION-test$GITHUB_RUN_NUMBER"
            gh release create "$tag" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Clip Captions $VERSION (test build)" \
              --notes "Test build, signed with the test key. It won't install over the normal app: use the latest release instead." \
              --prerelease
          fi
          # Tidy up old builds:
          # - keep the five newest test builds (pre-releases) and delete older ones;
          # - keep every proper release from 6.3 on: their download counts feed DOWNLOADS.md
          #   (stats.yml), and people can go back a version if they need to;
          # - delete releases before 6.3, which were all signed with the test key.
          # The "models" release (the translation model mirror) always stays.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '([.[] | select(.isPrerelease and .tagName != "models")][5:][].tagName),
                  (.[] | select((.isPrerelease | not) and .tagName != "models")
                       | select((.tagName | ltrimstr("v") | split("-")[0] | split(".") | map(tonumber? // 0)) < [6,3])
                       | .tagName)' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done
